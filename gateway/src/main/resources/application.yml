spring:
  application:
    name: gateway

  cloud:
    gateway:
      # ==============================================================
      # OJO GATEWAY 5: el prefijo es spring.cloud.gateway.SERVER.WEBFLUX
      # En la version 4.x era spring.cloud.gateway a secas.
      # Con el prefijo antiguo la app arranca sin errores pero NINGUNA
      # ruta se carga y todo responde 404.
      # ==============================================================
      server:
        webflux:
          routes:

            # ---------- Catalogo: lectura publica ----------
            - id: ms-catalogo
              uri: ${MS_CATALOGO_URI:http://localhost:8081}
              predicates:
                - Path=/api/catalogo/**
              filters:
                # /api/catalogo/animes  ->  /animes
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: cbCatalogo
                    fallbackUri: forward:/fallback/catalogo

            # ---------- Identidad ----------
            - id: ms-auth
              uri: ${MS_AUTH_URI:http://localhost:8082}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: cbAuth
                    fallbackUri: forward:/fallback/auth

            # ---------- Perfiles: mismo servicio, otra ruta ----------
            - id: ms-auth-perfiles
              uri: ${MS_AUTH_URI:http://localhost:8082}
              predicates:
                - Path=/api/perfiles/**
              filters:
                - StripPrefix=1   # /api/perfiles -> /perfiles
                - name: CircuitBreaker
                  args:
                    name: cbAuth
                    fallbackUri: forward:/fallback/auth

            # ---------- Interacciones ----------
            - id: ms-interacciones
              uri: ${MS_INTERACCIONES_URI:http://localhost:8083}
              predicates:
                - Path=/api/interacciones/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: cbInteracciones
                    fallbackUri: forward:/fallback/interacciones

          # ---------- CORS: unico lugar donde se configura ----------
          # Los microservicios NO configuran CORS: son inalcanzables
          # desde el navegador. Centralizarlo aqui evita reglas
          # duplicadas y contradictorias.
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                exposedHeaders: ["X-Request-Id"]
                allowCredentials: true
                maxAge: 3600

server:
  port: 8080
  shutdown: graceful
  netty:
    idle-timeout: 60s

# ---------- JWT: el MISMO secreto que ms-auth ----------
jwt:
  secret: ${JWT_SECRET}
  emisor-esperado: sugoianime-auth

# ---------- Resiliencia ----------
# Recuerda: sin el bloque timelimiter aplica un timeout por defecto
# de 1 segundo que aborta llamadas sanas.
resilience4j:
  circuitbreaker:
    instances:
      cbCatalogo:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      cbAuth:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      cbInteracciones:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      cbCatalogo:
        timeout-duration: 20s
      cbAuth:
        timeout-duration: 15s
      cbInteracciones:
        timeout-duration: 15s

# ---------- Swagger unificado ----------
springdoc:
  api-docs:
    enabled: true
    # El gateway no tiene endpoints propios que documentar, pero SpringDoc
    # necesita este bloque activo para registrar la interfaz Swagger UI.
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # Sin esto, el desplegable incluye una entrada vacia del propio gateway
    disable-swagger-default-url: true
    urls:
      - name: 1. Catalogo y Streaming
        url: /api/catalogo/v3/api-docs
      - name: 2. Identidad y Perfiles
        url: /api/auth/v3/api-docs
      - name: 3. Interacciones y Recomendaciones
        url: /api/interacciones/v3/api-docs
    urls-primary-name: 1. Catalogo y Streaming

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      access: read_only     # permite GET /actuator/gateway/routes

logging:
  level:
    cl.sugoianime: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
